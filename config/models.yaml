# Model catalog. Operator-maintained; `modelmesh catalog verify` compares it with each provider's /models.
#
# data_use is attested for the configured provider account (DECISIONS D4). Gemini free tier, Groq and OpenRouter
# stay may_train or unknown until reviewed. latency_prior values are rough starting points used only until
# telemetry exists; Ollama figures are unmeasured on the target GPU. Facts checked 2026-11-08 (ADR-0003).
version: "2026-11-08"
models:
  - id: gemini/gemini-3.1-flash-lite
    provider: gemini
    family: gemini
    size_tier: small
    context_window: 1048576
    max_output_tokens: 65536
    data_use: may_train
    free_tier: true
    tools: true
    json_object: true
    json_schema: { mode: best_effort, stream: false, with_tools: false }
    dropped_params: [presence_penalty, frequency_penalty]
    latency_prior: { ttft_ms: 700, tokens_per_s: 150 }

  - id: gemini/gemini-3.6-flash
    provider: gemini
    family: gemini
    size_tier: large
    context_window: 1048576
    max_output_tokens: 65536
    data_use: may_train
    free_tier: true
    tools: true
    json_object: true
    json_schema: { mode: best_effort, stream: false, with_tools: false }
    dropped_params: [presence_penalty, frequency_penalty]
    latency_prior: { ttft_ms: 1200, tokens_per_s: 100 }

  - id: groq/openai/gpt-oss-20b
    provider: groq
    family: gpt-oss
    size_tier: medium
    context_window: 131072
    max_output_tokens: 65536
    data_use: unknown
    free_tier: true
    tools: true
    json_object: true
    json_schema: { mode: strict, stream: false, with_tools: false }
    latency_prior: { ttft_ms: 300, tokens_per_s: 500 }
    limits: { rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000 }  # Developer-plan figures; free-plan limits unverified

  - id: groq/openai/gpt-oss-120b
    provider: groq
    family: gpt-oss
    size_tier: large
    context_window: 131072
    max_output_tokens: 65536
    data_use: unknown
    free_tier: true
    tools: true
    json_object: true
    json_schema: { mode: strict, stream: false, with_tools: false }
    latency_prior: { ttft_ms: 500, tokens_per_s: 300 }
    limits: { rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000 }  # Developer-plan figures; free-plan limits unverified

  # OpenRouter free models, chosen 2026-11-09 from /api/v1/models for structured-output support and families other
  # than Gemini and gpt-oss (so they can be judged independently). limits are per account across free models.
  - id: openrouter/nvidia/nemotron-3.5-super-vl:free
    provider: openrouter
    family: nemotron
    size_tier: large
    context_window: 1000000
    max_output_tokens: 131072
    data_use: unknown
    free_tier: true
    tools: true
    json_object: true
    json_schema: { mode: best_effort, stream: false, with_tools: false }
    latency_prior: { ttft_ms: 1500, tokens_per_s: 60 }
    limits: { rpm: 20, rpd: 50 }

  - id: openrouter/liquid/lfm-3-1.7b:free
    provider: openrouter
    family: lfm
    size_tier: small
    context_window: 262144
    max_output_tokens: 8192
    data_use: unknown
    free_tier: true
    tools: true
    json_object: true
    json_schema: { mode: best_effort, stream: false, with_tools: false }
    latency_prior: { ttft_ms: 1000, tokens_per_s: 80 }
    limits: { rpm: 20, rpd: 50 }

  - id: ollama/qwen3:4b
    provider: ollama
    family: qwen
    size_tier: small
    context_window: 8192
    max_output_tokens: 4096
    data_use: no_training
    local: true
    tools: true
    tool_choice: false
    json_object: true
    json_schema: { mode: best_effort, stream: false, with_tools: false }
    dropped_params: [presence_penalty, frequency_penalty, reasoning_effort]
    latency_prior: { ttft_ms: 3000, tokens_per_s: 25 }

  - id: ollama/llama3.2:3b
    provider: ollama
    family: llama
    size_tier: small
    context_window: 8192
    max_output_tokens: 4096
    data_use: no_training
    local: true
    tools: true
    tool_choice: false
    json_object: true
    json_schema: { mode: best_effort, stream: false, with_tools: false }
    dropped_params: [presence_penalty, frequency_penalty, reasoning_effort]
    latency_prior: { ttft_ms: 3000, tokens_per_s: 30 }
