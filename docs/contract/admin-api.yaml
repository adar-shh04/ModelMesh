openapi: 3.1.0
info:
  title: ModelMesh Admin API
  summary: Operator API. Not part of the client inference contract. Authenticated
    with MODELMESH_ADMIN_TOKEN.
  version: 1.0.0
paths:
  /admin/v1/tenants:
    post:
      summary: Create Tenant
      operationId: create_tenant_admin_v1_tenants_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Create Tenant Admin V1 Tenants Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/tenants/{tenant_id}:
    patch:
      summary: Update Tenant
      operationId: update_tenant_admin_v1_tenants__tenant_id__patch
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          title: Tenant Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantSettings'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Update Tenant Admin V1 Tenants  Tenant Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete Tenant
      operationId: delete_tenant_admin_v1_tenants__tenant_id__delete
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          title: Tenant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Delete Tenant Admin V1 Tenants  Tenant Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/tenants/{tenant_id}/keys:
    post:
      summary: Create Key
      operationId: create_key_admin_v1_tenants__tenant_id__keys_post
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          title: Tenant Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Create Key Admin V1 Tenants  Tenant Id  Keys Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: List Keys
      operationId: list_keys_admin_v1_tenants__tenant_id__keys_get
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          title: Tenant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response List Keys Admin V1 Tenants  Tenant Id  Keys Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/keys/{key_id}/revoke:
    post:
      summary: Revoke Key
      operationId: revoke_key_admin_v1_keys__key_id__revoke_post
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          title: Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Revoke Key Admin V1 Keys  Key Id  Revoke Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/keys/{key_id}/rotate:
    post:
      summary: Rotate Key
      operationId: rotate_key_admin_v1_keys__key_id__rotate_post
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          title: Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Rotate Key Admin V1 Keys  Key Id  Rotate Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/providers/{provider}:
    put:
      summary: Set Provider
      operationId: set_provider_admin_v1_providers__provider__put
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderToggle'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Set Provider Admin V1 Providers  Provider  Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/router-models:
    get:
      summary: List Router Models
      operationId: list_router_models_admin_v1_router_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response List Router Models Admin V1 Router Models Get
    post:
      summary: Register Router Model
      operationId: register_router_model_admin_v1_router_models_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterModelRegister'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Register Router Model Admin V1 Router Models Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/router-models/{version}/shadow:
    post:
      summary: Shadow Router Model
      description: Computes and logs this router's decisions next to live traffic.
        Traffic is not changed.
      operationId: shadow_router_model_admin_v1_router_models__version__shadow_post
      parameters:
      - name: version
        in: path
        required: true
        schema:
          type: string
          title: Version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Shadow Router Model Admin V1 Router Models  Version  Shadow
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/router-models/{version}/promote:
    post:
      summary: Promote Router Model
      description: Human approval to route traffic with this version. Refused unless
        the offline gate is met.
      operationId: promote_router_model_admin_v1_router_models__version__promote_post
      parameters:
      - name: version
        in: path
        required: true
        schema:
          type: string
          title: Version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPromotion'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Promote Router Model Admin V1 Router Models  Version  Promote
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/router-models/{version}/retire:
    post:
      summary: Retire Router Model
      operationId: retire_router_model_admin_v1_router_models__version__retire_post
      parameters:
      - name: version
        in: path
        required: true
        schema:
          type: string
          title: Version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Retire Router Model Admin V1 Router Models  Version  Retire
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    KeyCreate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        env:
          type: string
          enum:
          - live
          - test
          title: Env
          default: live
        limits:
          $ref: '#/components/schemas/KeyLimitsInput'
        scopes:
          $ref: '#/components/schemas/KeyScopes'
        data_policy_ceiling:
          type: string
          enum:
          - any
          - no_training_providers
          - local_only
          title: Data Policy Ceiling
          default: any
        content_retention:
          type: boolean
          title: Content Retention
          default: false
      additionalProperties: false
      type: object
      required:
      - name
      title: KeyCreate
    KeyLimitsInput:
      properties:
        rpm:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Rpm
        tpm:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Tpm
        concurrency:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Concurrency
        daily_budget_usd:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Daily Budget Usd
        monthly_budget_usd:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Monthly Budget Usd
      additionalProperties: false
      type: object
      title: KeyLimitsInput
    KeyScopes:
      properties:
        allowed_providers:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Allowed Providers
        allowed_models:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Allowed Models
        cache_enabled:
          type: boolean
          title: Cache Enabled
          default: true
        cache_max_ttl_s:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Cache Max Ttl S
      additionalProperties: false
      type: object
      title: KeyScopes
    ProviderToggle:
      properties:
        enabled:
          type: boolean
          title: Enabled
      additionalProperties: false
      type: object
      required:
      - enabled
      title: ProviderToggle
    RouterModelRegister:
      properties:
        version:
          type: string
          maxLength: 128
          minLength: 1
          title: Version
        artifact_uri:
          type: string
          minLength: 1
          title: Artifact Uri
          description: Path to the artifact JSON on the server
        metrics:
          additionalProperties: true
          type: object
          title: Metrics
          description: 'Offline report summary: preliminary, criterion_passed, ece_calibrated,
            report path'
        mlflow_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Mlflow Run Id
      additionalProperties: false
      type: object
      required:
      - version
      - artifact_uri
      title: RouterModelRegister
    RouterPromotion:
      properties:
        approved_by:
          type: string
          maxLength: 200
          minLength: 1
          title: Approved By
        confirm:
          type: boolean
          const: true
          title: Confirm
      additionalProperties: false
      type: object
      required:
      - approved_by
      - confirm
      title: RouterPromotion
    TenantCreate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        settings:
          additionalProperties: true
          type: object
          title: Settings
      additionalProperties: false
      type: object
      required:
      - name
      title: TenantCreate
    TenantSettings:
      properties:
        settings:
          additionalProperties: true
          type: object
          title: Settings
      additionalProperties: false
      type: object
      required:
      - settings
      title: TenantSettings
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
